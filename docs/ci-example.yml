name: Steward checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    # Standard hosted runner. Public repositories run free; no paid larger runners.
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      AGENTMAIL_API_KEY: ''
      APPROVAL_EMAIL: ''
      PUBLIC_BASE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm test
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
