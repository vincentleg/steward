<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#f6f7fb" />
    <meta
      name="description"
      content="When plans break, Steward fixes them. One decision. Your life is handled."
    />
    <title>STEWARD — Your life is handled.</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div class="app-shell">
      <header>
        <a class="brand" href="/" aria-label="Steward home"
          >STEW<span class="brand-a">A</span>RD<span class="brand-dot">●</span></a
        >
        <div class="header-center"><span class="status-dot"></span> PERSONAL OPERATIONS, ON.</div>
        <div class="profile">
          <span class="avatar">V</span><span>Vincent <span class="subtle">/ Personal</span></span>
        </div>
      </header>
      <main id="main" aria-live="polite"></main>
      <footer>
        <span>WHEN PLANS BREAK, STEWARD FIXES THEM.</span>
        <div class="footer-controls">
          <button id="constitution-toggle">Constitution <span>↗</span></button
          ><button id="stop" hidden>Stop</button
          ><button id="proof-toggle">Live proof <span>↗</span></button
          ><span class="separator"></span><button id="replay">Replay <span>↻</span></button
          ><button id="reset" title="Return to calm; current workflow continues">Reset</button
          ><span id="mode" class="mode-tag">SANDBOX WORLD · LIVE AGENT</span>
        </div>
      </footer>
    </div>
    <aside
      id="proof"
      class="proof-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="proof-title"
      hidden
    >
      <div class="proof-head">
        <div>
          <span class="eyebrow">THE WORLD IS SANDBOXED.</span>
          <h3 id="proof-title">The agent isn’t.</h3>
        </div>
        <button id="proof-close" aria-label="Close live proof">×</button>
      </div>
      <div id="proof-content"></div>
    </aside>
    <aside
      id="constitution"
      class="proof-panel"
      role="dialog"
      aria-modal="true"
      aria-labelledby="constitution-title"
      hidden
    >
      <div class="proof-head">
        <div>
          <span class="eyebrow">YOUR MANDATE, ENFORCED</span>
          <h3 id="constitution-title">Steward Constitution</h3>
        </div>
        <button id="constitution-close" aria-label="Close constitution">×</button>
      </div>
      <div id="constitution-content"></div>
    </aside>
    <div id="toast" role="status" hidden></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
